<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rob-Ot">
<meta name="theme-color" content="#0d0d0d">
<title>Rob-Ot</title>
<style>
:root{
  --bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--bg4:#252525;
  --border:#2a2a2a;--border2:#333;
  --text:#f0f0f0;--text2:#888;--text3:#555;
  --green:#00e676;--green2:#00c853;--green-dim:rgba(0,230,118,.12);
  --orange:#ff6d00;--blue:#448aff;--yellow:#ffd740;--red:#ff5252;--purple:#e040fb;
  --gold:#FFD700;--gold-dim:rgba(255,215,0,.15);
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh;overscroll-behavior:none}
.app{max-width:430px;margin:0 auto;padding:0 0 90px}
.header{background:rgba(13,13,13,.95);border-bottom:1px solid var(--border);padding:10px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(20px)}
.logo{display:flex;align-items:center;gap:10px}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-name{font-size:16px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:8px}
.streak-pill{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 9px}
.streak-pill-icon{font-size:13px;line-height:1}
.streak-pill-num{font-size:13px;font-weight:700;color:var(--orange)}
.streak-pill-lbl{font-size:10px;color:var(--text3)}
.credits-pill{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--gold);border-radius:20px;padding:4px 9px}
.credits-pill-num{font-size:13px;font-weight:700;color:var(--gold)}
.credits-pill-lbl{font-size:10px;color:var(--text3)}
.date-nav{display:flex;align-items:center;gap:4px}
.date-nav button{background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:15px;width:26px;height:26px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.date-label{font-size:11px;color:var(--text2);min-width:52px;text-align:center}
.tabs{display:flex;background:rgba(13,13,13,.95);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:99;padding:0 8px;backdrop-filter:blur(20px)}
.tab{flex:1;padding:10px 2px;text-align:center;font-size:10px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:var(--text3);transition:all .15s;letter-spacing:.4px;text-transform:uppercase}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.section{padding:14px 16px}
.macro-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.mc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;position:relative;overflow:hidden}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.mc.kcal::before{background:var(--orange)}.mc.prot::before{background:var(--green)}
.mc.carb::before{background:var(--blue)}.mc.fat::before{background:var(--yellow)}.mc.fib::before{background:var(--purple)}
.mc.full{grid-column:1/-1}
.mc-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.mc-val{font-size:21px;font-weight:700;line-height:1;color:var(--text)}
.mc-unit{font-size:12px;font-weight:400;color:var(--text3)}
.mc-sub{font-size:11px;color:var(--text3);margin-top:2px}
.mc-rem{position:absolute;top:11px;right:10px;font-size:10px;color:var(--text3);text-align:right;line-height:1.4}
.mc-rem .val{display:block;font-size:12px;font-weight:700;color:var(--text2)}
.mc-rem .val.done{color:var(--green)}
.bar{height:3px;background:var(--bg4);border-radius:2px;margin-top:8px;overflow:hidden}
.bar-f{height:100%;border-radius:2px;transition:width .4s}
.b-kcal{background:var(--orange)}.b-prot{background:var(--green)}.b-carb{background:var(--blue)}.b-fat{background:var(--yellow)}.b-fib{background:var(--purple)}
.sport-btn{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 14px;margin-bottom:12px;cursor:pointer;transition:all .15s}
.sport-btn.active{border-color:var(--blue);background:rgba(68,138,255,.08)}
.sport-btn-icon{font-size:18px}
.sport-btn-text{flex:1}
.sport-btn-label{font-size:13px;font-weight:500}
.sport-btn-sub{font-size:11px;color:var(--text3);margin-top:1px}
.sport-badge{background:var(--blue);color:#fff;border-radius:4px;font-size:10px;font-weight:700;padding:2px 6px}
.log-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0;margin-bottom:4px}
.log-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.log-toggle-icon{font-size:10px;color:var(--text3);transition:transform .2s}
.log-toggle-icon.open{transform:rotate(180deg)}
.log-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.log-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.log-info{flex:1;min-width:0}
.log-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-mac{font-size:11px;color:var(--text3);margin-top:2px}
.log-kcal{font-size:14px;font-weight:700;color:var(--orange);flex-shrink:0}
.del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;line-height:1;padding:2px 4px;border-radius:4px}
.del-btn:active{color:var(--red)}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:28px 0;line-height:2}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card-title{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;font-weight:600}
.meal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.meal-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:10px;cursor:pointer;text-align:left}
.meal-btn:active{background:var(--bg4)}
.meal-btn-name{font-size:13px;font-weight:500;color:var(--text)}
.meal-btn-kcal{font-size:11px;color:var(--orange);margin-top:3px}
.cat-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0;border-bottom:1px solid var(--border)}
.cat-name{font-size:12px;font-weight:600;color:var(--text2)}
.cat-n{font-size:11px;color:var(--text3);margin-left:4px}
.cat-arr{font-size:10px;color:var(--text3)}
.food-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.food-row:last-child{border-bottom:none}
.food-row-name{font-size:13px;font-weight:500}
.food-row-sub{font-size:11px;color:var(--text3);margin-top:1px}
.add-btn{background:var(--green-dim);border:1px solid var(--green);border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--green);font-weight:600}
.add-btn:active{background:var(--green);color:#000}
.man-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.man-field{display:flex;flex-direction:column;gap:4px}
.man-field label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.man-field input,.man-field select{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:9px 10px;font-size:14px;color:var(--text);outline:none}
.man-field input:focus,.man-field select:focus{border-color:var(--green)}
.man-field.full{grid-column:1/-1}
.man-add{width:100%;margin-top:10px;background:var(--green);color:#000;border:none;border-radius:var(--rs);padding:11px;font-size:14px;font-weight:700;cursor:pointer}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-lbl{font-size:13px;color:var(--text)}
.set-inp{width:78px;text-align:right;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:5px 8px;font-size:13px;color:var(--text)}
.toggle{width:44px;height:26px;background:var(--bg4);border-radius:13px;position:relative;cursor:pointer;border:1px solid var(--border2);transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--green);border-color:var(--green)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.toggle.on::after{left:20px}
.sm-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:4px 9px;font-size:11px;cursor:pointer;color:var(--text2)}
.sm-btn.del{border-color:rgba(255,82,82,.35);color:var(--red)}
.meal-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:10px;margin-bottom:6px}
.meal-card-hdr{display:flex;align-items:center;justify-content:space-between}
.meal-ed-item{display:flex;align-items:center;gap:5px;margin-bottom:5px;margin-top:8px}
.meal-ed-item select,.meal-ed-item input[type=number]{background:var(--bg4);border:1px solid var(--border2);border-radius:5px;padding:5px 7px;font-size:12px;color:var(--text)}
.meal-ed-item select{flex:1}.meal-ed-item input[type=number]{width:58px}
.meal-ed-item button{background:none;border:none;color:var(--red);font-size:17px;cursor:pointer}
.ing-btn{background:none;border:1px solid var(--border2);border-radius:5px;padding:4px 8px;font-size:11px;color:var(--text3);cursor:pointer;margin-top:4px}
.new-meal-btn{width:100%;background:var(--green-dim);border:1px solid var(--green);color:var(--green);border-radius:var(--rs);padding:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px}
.hist-table{width:100%;border-collapse:collapse;font-size:12px}
.hist-table th{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--border);text-align:right}
.hist-table th:first-child{text-align:left}
.hist-table td{padding:7px 4px;border-bottom:1px solid var(--border);color:var(--text2);text-align:right;font-variant-numeric:tabular-nums}
.hist-table td:first-child{text-align:left;color:var(--text);font-weight:500}
.hist-table tr:last-child td{border-bottom:none}
.hist-ok{color:var(--green);font-weight:600}
.hist-over{color:var(--red);font-weight:600}
.unit-tag{font-size:10px;color:var(--orange);font-weight:600;margin-left:4px;opacity:.8}

/* GAME */
.game-header{background:var(--bg2);border:1px solid var(--gold);border-radius:var(--r);padding:14px;margin-bottom:12px;text-align:center}
.game-title{font-size:18px;font-weight:700;color:var(--gold);margin-bottom:4px}
.game-subtitle{font-size:11px;color:var(--text3);margin-bottom:10px}
.game-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.game-stat{background:var(--bg3);border-radius:8px;padding:8px;text-align:center}
.game-stat-val{font-size:18px;font-weight:700;color:var(--gold)}
.game-stat-lbl{font-size:10px;color:var(--text3);margin-top:2px}
.castle-container{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.castle-title{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.castle-progress{font-size:11px;color:var(--gold)}
.castle-svg{width:100%;max-width:340px;display:block;margin:0 auto}
.buy-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.buy-title{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;font-weight:600}
.buy-credits{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.buy-credits-label{font-size:13px;color:var(--text)}
.buy-credits-val{font-size:20px;font-weight:700;color:var(--gold)}
.buy-btn{width:100%;background:var(--gold);color:#000;border:none;border-radius:var(--rs);padding:12px;font-size:14px;font-weight:700;cursor:pointer}
.buy-btn:disabled{opacity:.3;cursor:not-allowed}
.buy-btn-sub{text-align:center;font-size:11px;color:var(--text3);margin-top:6px}
.progress-bar-container{margin-top:10px}
.progress-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:4px}
.progress-bar-bg{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),#FFA500);border-radius:3px;transition:width .4s}

/* QTY MODAL */
.qty-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;z-index:200;backdrop-filter:blur(6px)}
.qty-inner{background:var(--bg2);border:1px solid var(--border2);border-radius:18px 18px 0 0;padding:22px 16px 38px;width:100%;max-width:430px;margin:0 auto}
.qty-title{font-size:17px;font-weight:700;margin-bottom:3px}
.qty-sub{font-size:12px;color:var(--text3);margin-bottom:16px}
.qty-row{display:flex;gap:8px}
.qty-row input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:13px;font-size:19px;color:var(--text);outline:none}
.qty-row input:focus{border-color:var(--green)}
.qty-row button{background:var(--green);color:#000;border:none;border-radius:var(--rs);padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer}
.qty-cancel{background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;margin-top:12px;width:100%;text-align:center;padding:6px}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <div class="logo">
    <div style="width:36px;height:36px;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px">🤖</div>
    <div class="logo-text">
      <span class="logo-name">Rob-Ot</span>
      <span class="logo-sub">Meal Tracker by Rob</span>
    </div>
  </div>
  <div class="header-right">
    <div class="credits-pill" id="creditsPill">
      <span style="font-size:13px">🏅</span>
      <span class="credits-pill-num" id="creditsNum">0</span>
      <span class="credits-pill-lbl">cr</span>
    </div>
    <div class="streak-pill" id="streakPill">
      <span class="streak-pill-icon" id="streakIcon">💪</span>
      <span class="streak-pill-num" id="streakNum">0</span>
      <span class="streak-pill-lbl">days</span>
    </div>
    <div class="date-nav">
      <button onclick="changeDay(-1)">‹</button>
      <span class="date-label" id="dateLabel"></span>
      <button onclick="changeDay(1)">›</button>
    </div>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('today')">Today</div>
  <div class="tab" onclick="switchTab('add')">Add</div>
  <div class="tab" onclick="switchTab('game')">Game</div>
  <div class="tab" onclick="switchTab('settings')">Settings</div>
</div>
<div id="tab-today" class="section"></div>
<div id="tab-add" class="section" style="display:none"></div>
<div id="tab-game" class="section" style="display:none"></div>
<div id="tab-settings" class="section" style="display:none"></div>
</div>

<div class="qty-modal" id="qtyModal" style="display:none">
  <div class="qty-inner">
    <div class="qty-title" id="qtyTitle"></div>
    <div class="qty-sub" id="qtySub"></div>
    <div class="qty-row">
      <input type="number" id="qtyInput" min="1" max="5000" placeholder="0">
      <button onclick="confirmAdd()">Add</button>
    </div>
    <button class="qty-cancel" onclick="closeModal()">Annulla</button>
  </div>
</div>

function getLog(dk){dk=dk||S.currentDate;if(!S.logs[dk])S.logs[dk]=[];return S.logs[dk]}
function calc(f,qty){const m=qty/(f.perUnit?1:100);return{kcal:Math.round(f.kcal*m),protein:r1(f.protein*m),carbs:r1(f.carbs*m),fat:r1(f.fat*m),fiber:r1(f.fiber*m)}}
function r1(n){return Math.round(n*10)/10}
function totals(dk){const l=S.logs[dk]||[];const t={kcal:0,protein:0,carbs:0,fat:0,fiber:0};l.forEach(e=>{t.kcal+=e.kcal;t.protein+=e.protein;t.carbs+=e.carbs;t.fat+=e.fat;t.fiber+=e.fiber});return{kcal:Math.round(t.kcal),protein:r1(t.protein),carbs:r1(t.carbs),fat:r1(t.fat),fiber:r1(t.fiber)}}
function pct(v,g){return Math.min(100,Math.round(v/g*100))}

function getDayTarget(dk){
  const base=S.goals.kcal;
  const sport=(S.sportDays||{})[dk];
  return sport?base+200:base;
}

function isDayValid(dk){
  const t=totals(dk);
  if((S.logs[dk]||[]).length===0)return null;// no data
  const target=getDayTarget(dk);
  return t.kcal<=target+201;
}

function isDayOver(dk){
  const t=totals(dk);
  if((S.logs[dk]||[]).length===0)return false;
  const target=getDayTarget(dk);
  return t.kcal>target+201;
}

function isDoubleover(dk){
  const t=totals(dk);
  if((S.logs[dk]||[]).length===0)return false;
  return t.kcal>=S.goals.kcal*2;
}

// Get Mon of week containing date string
function getWeekMon(dk){
  const d=new Date(dk+'T12:00:00');
  const day=d.getDay();
  const diff=day===0?-6:1-day;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}

function getWeekDays(monStr){
  const days=[];const d=new Date(monStr+'T12:00:00');
  for(let i=0;i<7;i++){days.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}
  return days;
}

function calcStreak(){
  let streak=0;
  const d=new Date(today()+'T12:00:00');
  // track over days per week as we go back
  const weekOverCount={};
  for(let i=0;i<365;i++){
    const dk=d.toISOString().slice(0,10);
    const valid=isDayValid(dk);
    const over=isDayOver(dk);
    const dbl=isDoubleover(dk);
    const mon=getWeekMon(dk);
    if(!weekOverCount[mon])weekOverCount[mon]=0;
    if(over)weekOverCount[mon]++;
    // reset conditions
    if(dbl){break;}
    if(weekOverCount[mon]>=2){break;}
    if(valid===null&&i>0){break;}// no data and not today
    if(valid)streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

// Auto-credit days that qualify and haven't been credited yet
function autoCredit(){
  const allDays=Object.keys(S.logs).filter(k=>(S.logs[k]||[]).length>0);
  if(!S.creditedDays)S.creditedDays={};
  allDays.forEach(dk=>{
    if(!S.creditedDays[dk]&&isDayValid(dk)){
      S.credits=(S.credits||0)+1;
      S.creditedDays[dk]=true;
    }
  });
}

// Check streak reset and remove castle pieces
function checkStreakReset(){
  // Check if any week has 2+ over days or any day is doubleover
  const allDays=Object.keys(S.logs).filter(k=>(S.logs[k]||[]).length>0).sort();
  const weekOver={};
  let resetTriggered=false;
  allDays.forEach(dk=>{
    const mon=getWeekMon(dk);
    if(!weekOver[mon])weekOver[mon]=0;
    if(isDayOver(dk)){
      weekOver[mon]++;
      if(weekOver[mon]>=2)resetTriggered=true;
    }
    if(isDoubleover(dk))resetTriggered=true;
  });
  return resetTriggered;
}

  if(p>=19){const prog=Math.min(1,(p-18)/8);const gW=44,gH=Math.round(55*prog);const gX=158,gY=240-gH;s+=`<rect x="${gX}" y="${gY}" width="${gW}" height="${gH}" fill="#05050f"/>`;if(prog>0.6){const ap=(prog-0.6)/0.4;s+=`<path d="M${gX},${gY+8} Q${gX+gW/2},${gY-10*ap} ${gX+gW},${gY+8}" fill="#05050f" stroke="#5a4e3a" stroke-width="1.5"/>`;}if(prog>0.5){for(let i=0;i<4;i++)s+=`<rect x="${gX+6+i*9}" y="${gY+5}" width="3" height="${gH-5}" fill="#2a2018" opacity="0.8"/>`;s+=`<rect x="${gX+4}" y="${gY+gH*0.4}" width="${gW-8}" height="3" fill="#2a2018" opacity="0.6"/>`;}if(prog>0.4)[[110,195],[120,185],[240,195],[250,185]].forEach(([sx,sy])=>s+=`<rect x="${sx}" y="${sy}" width="5" height="14" rx="2" fill="#05050f"/>`);if(prog>0.7){const tf=(prog-0.7)/0.3;s+=`<rect x="152" y="210" width="4" height="12" fill="#6a5a42"/>`;s+=`<ellipse cx="154" cy="210" rx="4" ry="${6*tf}" fill="#FF8C00" opacity="${tf}"/>`;s+=`<ellipse cx="154" cy="210" rx="2" ry="${4*tf}" fill="#FFD700" opacity="${tf}"/>`;s+=`<rect x="204" y="210" width="4" height="12" fill="#6a5a42"/>`;s+=`<ellipse cx="206" cy="210" rx="4" ry="${6*tf}" fill="#FF8C00" opacity="${tf}"/>`;s+=`<ellipse cx="206" cy="210" rx="2" ry="${4*tf}" fill="#FFD700" opacity="${tf}"/>`;}}
  if(p>=27){const prog=Math.min(1,(p-26)/8);const tH=Math.round(90*prog);const tTop=220-tH;s+=`<rect x="55" y="${tTop}" width="55" height="${tH}" fill="url(#tower1)"/>`;for(let row=0;row<Math.floor(tH/10);row++){const ly=tTop+row*10;s+=`<line x1="55" y1="${ly}" x2="110" y2="${ly}" stroke="#3a3020" stroke-width="0.5" opacity="0.4"/>`;}if(prog>0.5){const wp=(prog-0.5)/0.5;s+=`<rect x="75" y="${tTop+tH*0.3}" width="14" height="${18*wp}" rx="3" fill="#05050f"/>`;if(wp>0.7)s+=`<ellipse cx="82" cy="${tTop+tH*0.3+4}" rx="7" ry="5" fill="#FFD700" opacity="${(wp-0.7)/0.3*0.4}"/>`;}s+=`<rect x="55" y="${tTop}" width="7" height="${tH}" fill="#1a1510" opacity="0.5"/>`;}
  if(p>=35){const prog=Math.min(1,(p-34)/8);const tH=Math.round(90*prog);const tTop=220-tH;s+=`<rect x="250" y="${tTop}" width="55" height="${tH}" fill="url(#tower1)"/>`;for(let row=0;row<Math.floor(tH/10);row++){const ly=tTop+row*10;s+=`<line x1="250" y1="${ly}" x2="305" y2="${ly}" stroke="#3a3020" stroke-width="0.5" opacity="0.4"/>`;}if(prog>0.5){const wp=(prog-0.5)/0.5;s+=`<rect x="271" y="${tTop+tH*0.3}" width="14" height="${18*wp}" rx="3" fill="#05050f"/>`;if(wp>0.7)s+=`<ellipse cx="278" cy="${tTop+tH*0.3+4}" rx="7" ry="5" fill="#FFD700" opacity="${(wp-0.7)/0.3*0.4}"/>`;}s+=`<rect x="298" y="${tTop}" width="7" height="${tH}" fill="#1a1510" opacity="0.5"/>`;}
  if(p>=43){const prog=Math.min(1,(p-42)/5);for(let i=0;i<9;i++){const bx=82+i*22;const bH=Math.round(16*prog);s+=`<rect x="${bx}" y="${150-bH}" width="14" height="${bH}" fill="url(#stone2)"/>`;}for(let i=0;i<4;i++){const bx=57+i*13;const bH=Math.round(14*prog);s+=`<rect x="${bx}" y="${130-bH}" width="9" height="${bH}" fill="url(#stone2)"/>`;}for(let i=0;i<4;i++){const bx=252+i*13;const bH=Math.round(14*prog);s+=`<rect x="${bx}" y="${130-bH}" width="9" height="${bH}" fill="url(#stone2)"/>`;}if(prog>0.4){const sp=(prog-0.4)/0.6;const spH=Math.round(45*sp);s+=`<polygon points="180,${150-spH} 165,150 195,150" fill="#6a5a42"/>`;s+=`<polygon points="180,${150-spH} 165,150 195,150" fill="none" stroke="#8a7a62" stroke-width="0.8"/>`;}}
  if(p>=48){const prog=Math.min(1,(p-47)/3);s+=`<line x1="82" y1="116" x2="82" y2="${116-Math.round(22*prog)}" stroke="#8a7a62" stroke-width="1.5"/>`;if(prog>0.3)s+=`<polygon points="82,${116-22*prog} 99,${116-22*prog+9} 82,${116-22*prog+18}" fill="#ff5252" opacity="${prog}"/>`;s+=`<line x1="278" y1="116" x2="278" y2="${116-Math.round(22*prog)}" stroke="#8a7a62" stroke-width="1.5"/>`;if(prog>0.3)s+=`<polygon points="278,${116-22*prog} 295,${116-22*prog+9} 278,${116-22*prog+18}" fill="#ff5252" opacity="${prog}"/>`;if(prog>0.5){const fp=(prog-0.5)/0.5;s+=`<line x1="180" y1="105" x2="180" y2="${105-Math.round(25*fp)}" stroke="#8a7a62" stroke-width="1.5"/>`;s+=`<polygon points="180,${105-25*fp} 200,${105-25*fp+10} 180,${105-25*fp+20}" fill="#FFD700" opacity="${fp}"/>`;} if(prog>0.8){const gp=(prog-0.8)/0.2;s+=`<ellipse cx="180" cy="180" rx="140" ry="80" fill="url(#glow)" opacity="${gp*0.6}" filter="url(#blur4)"/>`;[[100,120],[260,120],[60,160],[300,170],[180,90]].forEach(([sx,sy])=>{s+=`<circle cx="${sx}" cy="${sy}" r="3" fill="#FFD700" opacity="${gp}"/>`;s+=`<line x1="${sx-6}" y1="${sy}" x2="${sx+6}" y2="${sy}" stroke="#FFD700" stroke-width="1" opacity="${gp*0.7}"/>`;s+=`<line x1="${sx}" y1="${sy-6}" x2="${sx}" y2="${sy+6}" stroke="#FFD700" stroke-width="1" opacity="${gp*0.7}"/>`;});}}
  // Ghost silhouette
  const ghostOp=Math.max(0.04,0.18*(1-pct));
  s+=`<g opacity="${ghostOp}" fill="none" stroke="#FFD700" stroke-width="0.8" stroke-dasharray="3,3">`;
  s+=`<rect x="60" y="220" width="240" height="20"/>`;
  s+=`<rect x="80" y="150" width="200" height="70"/>`;
  s+=`<rect x="158" y="185" width="44" height="55"/>`;
  s+=`<path d="M158,193 Q180,175 202,193"/>`;
  s+=`<rect x="55" y="130" width="55" height="90"/>`;
  s+=`<rect x="250" y="130" width="55" height="90"/>`;
  for(let i=0;i<4;i++)s+=`<rect x="${57+i*13}" y="116" width="9" height="14"/>`;
  for(let i=0;i<4;i++)s+=`<rect x="${252+i*13}" y="116" width="9" height="14"/>`;
  for(let i=0;i<9;i++)s+=`<rect x="${82+i*22}" y="134" width="14" height="16"/>`;
  s+=`<polygon points="180,105 165,150 195,150"/>`;
  s+=`<line x1="82" y1="116" x2="82" y2="94"/><polygon points="82,94 99,103 82,112"/>`;
  s+=`<line x1="278" y1="116" x2="278" y2="94"/><polygon points="278,94 295,103 278,112"/>`;
  s+=`<line x1="180" y1="105" x2="180" y2="80"/><polygon points="180,80 200,90 180,100"/>`;
  s+=`</g>`;
  if(p>=15){const rp=Math.min(1,(p-14)/10);s+=`<rect x="0" y="248" width="${W}" height="12" fill="#0a1520" opacity="${rp*0.6}"/>`;s+=`<path d="M60,252 Q120,248 180,252 Q240,256 300,252" stroke="#1a3a5a" stroke-width="1" fill="none" opacity="${rp*0.5}"/>`;}
  if(p===0)s+=`<text x="${W/2}" y="${H/2+10}" text-anchor="middle" fill="#444" font-size="13" font-family="sans-serif">Inizia a costruire! 🏰</text>`;
  s+=`</svg>`;
  return s;
}

function renderGame(){
  const credits=S.credits||0;
  const pieces=S.castlePieces||0;
  const validDays=Object.keys(S.logs).filter(k=>(S.logs[k]||[]).length>0&&isDayValid(k)).length;
  const daysLeft=Math.max(0,Math.ceil((new Date(WEDDING_DATE)-new Date())/86400000));
  const canBuy=credits>0&&pieces<TOTAL_PIECES;

  document.getElementById('tab-game').innerHTML=`
  <div class="game-header">
    <div class="game-title">🏰 Il Castello del Matrimonio</div>
    <div class="game-subtitle">Costruisci il castello entro il giorno del tuo matrimonio</div>
    <div class="progress-bar-container">
      <div class="progress-bar-label"><span>Progresso castello</span><span>${pieces}/${TOTAL_PIECES} pezzi</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${Math.round(pieces/TOTAL_PIECES*100)}%"></div></div>
    </div>
    <div class="game-stats">
      <div class="game-stat"><div class="game-stat-val">${daysLeft}</div><div class="game-stat-lbl">giorni al sì</div></div>
      <div class="game-stat"><div class="game-stat-val">${validDays}</div><div class="game-stat-lbl">giorni ok</div></div>
      <div class="game-stat"><div class="game-stat-val">${credits}</div><div class="game-stat-lbl">crediti</div></div>
    </div>
  </div>
  <div class="castle-container">
    <div class="castle-title"><span>Il tuo castello</span><span class="castle-progress">${pieces}/${TOTAL_PIECES} 🧱</span></div>
    ${renderCastleSVG(pieces)}
  </div>
  <div class="buy-section">
    <div class="buy-title">Costruisci</div>
    <div class="buy-credits"><span class="buy-credits-label">Crediti disponibili</span><span class="buy-credits-val">🏅 ${credits}</span></div>
    <button class="buy-btn" onclick="buyPiece()" ${canBuy?'':'disabled'}>
      ${pieces>=TOTAL_PIECES?'🏰 Castello completato!':canBuy?'Acquista 1 pezzo — 1 credito':'Nessun credito disponibile'}
    </button>
    <div class="buy-btn-sub">${pieces>=TOTAL_PIECES?'Sei pronto per il grande giorno! 💍':credits===0?'Guadagna crediti mangiando sotto target':'Ogni giorno sotto target = 1 credito da spendere'}</div>
  </div>`;
}

function buyPiece(){
  if((S.credits||0)<=0||(S.castlePieces||0)>=TOTAL_PIECES)return;
  S.credits--;
  S.castlePieces++;
  save();updateHeader();renderGame();
}

function loseRandomPieces(n){
  const lose=Math.min(n,S.castlePieces||0);
  S.castlePieces=Math.max(0,(S.castlePieces||0)-lose);
  if(lose>0)alert(`😱 Streak spezzato! Hai perso ${lose} ${lose===1?'pezzo':'pezzi'} del castello!`);
  save();
}

function renderSettings(){
  const g=S.goals;
  const allDays=Object.keys(S.logs).filter(k=>(S.logs[k]||[]).length>0).sort().reverse().slice(0,30);
  let histHtml='';
  if(!allDays.length)histHtml=`<div style="text-align:center;color:var(--text3);font-size:12px;padding:16px 0">Nessun dato ancora</div>`;
  else{
    histHtml=`<table class="hist-table"><thead><tr><th>Data</th><th>Kcal</th><th>Prot</th><th>Carb</th><th>Gras</th><th>Fb</th></tr></thead><tbody>`;
    allDays.forEach(k=>{
      const t=totals(k);const d=new Date(k+'T12:00:00');
      const lbl=k===today()?'Oggi':d.toLocaleDateString('it-IT',{day:'numeric',month:'short'});
      const target=getDayTarget(k);const ok=Math.abs(t.kcal-target)<=201;
      const sport=!!(S.sportDays||{})[k];
      histHtml+=`<tr><td>${lbl}${sport?' 🏋️':''}</td><td class="${ok?'hist-ok':'hist-over'}">${t.kcal}</td><td>${t.protein}</td><td>${t.carbs}</td><td>${t.fat}</td><td>${t.fiber}</td></tr>`;
    });
    histHtml+=`</tbody></table>`;
  }
  const mrows=S.meals.map((m,mi)=>{
    const ed=S.editMeal===mi;
    let items='';
    if(ed)items=m.items.map((it,ii)=>`<div class="meal-ed-item"><select onchange="updMI(${mi},${ii},'fid',this.value)">${S.foods.map(f=>`<option value="${f.id}"${f.id===it.fid?' selected':''}>${f.name}${f.perUnit?' (u)':''}</option>`).join('')}</select><input type="number" value="${it.qty}" min="1" onchange="updMI(${mi},${ii},'qty',this.value)"><button onclick="remMI(${mi},${ii})">×</button></div>`).join('');
    return`<div class="meal-card"><div class="meal-card-hdr">${ed?`<input style="background:var(--bg4);border:1px solid var(--border2);border-radius:5px;padding:4px 8px;font-size:13px;color:var(--text);width:130px" value="${m.name}" onchange="updMN(${mi},this.value)">`:`<span style="font-size:13px;font-weight:500">${m.name}</span>`}<div style="display:flex;gap:4px"><button class="sm-btn" onclick="togMeal(${mi})">${ed?'Salva':'Modifica'}</button><button class="sm-btn del" onclick="delMeal(${mi})">Elimina</button></div></div>${ed?`<div>${items}<button class="ing-btn" onclick="addMI(${mi})">+ Ingrediente</button></div>`:''}</div>`;
  }).join('');

  document.getElementById('tab-settings').innerHTML=`
  <div class="card"><div class="card-title">Obiettivi giornalieri</div>
    ${['kcal','protein','carbs','fat','fiber'].map(k=>`<div class="set-row"><span class="set-lbl">${{kcal:'Calorie',protein:'Proteine',carbs:'Carboidrati',fat:'Grassi',fiber:'Fibra'}[k]} ${k==='kcal'?'(kcal)':'(g)'}</span><input class="set-inp" type="number" value="${g[k]}" onchange="updGoal('${k}',this.value)"></div>`).join('')}
  </div>
  <div class="card">
    <div class="card-title">Aggiungi alimento al database</div>
    <div class="man-grid">
      <div class="man-field full"><label>Nome</label><input type="text" id="db-name" placeholder="es. Quinoa"></div>
      <div class="man-field full"><label>Categoria</label><select id="db-cat"><option value="carbs">Carboidrati</option><option value="protein">Proteine</option><option value="veggies">Verdure & Frutta</option><option value="other">Altro</option></select></div>
      <div class="man-field full"><label>Tipo di misura</label><select id="db-type" onchange="toggleDbUnit()"><option value="100g">Per 100g / ml</option><option value="unit">Per unità</option></select></div>
      <div class="man-field full" id="db-unit-row" style="display:none"><label>Nome unità</label><input type="text" id="db-unit-name" placeholder="es. fetta"></div>
      <div class="man-field"><label>Calorie (kcal)</label><input type="number" id="db-kcal" placeholder="0" min="0"></div>
      <div class="man-field"><label>Proteine (g)</label><input type="number" id="db-prot" placeholder="0" min="0" step="0.1"></div>
      <div class="man-field"><label>Carboidrati (g)</label><input type="number" id="db-carb" placeholder="0" min="0" step="0.1"></div>
      <div class="man-field"><label>Grassi (g)</label><input type="number" id="db-fat" placeholder="0" min="0" step="0.1"></div>
      <div class="man-field"><label>Fibra (g)</label><input type="number" id="db-fib" placeholder="0" min="0" step="0.1"></div>
    </div>
    <button class="man-add" onclick="addFoodToDB()">+ Aggiungi al database</button>
  </div>
  <div class="card">
    <div class="card-title">Storico macro (ultimi 30 giorni)</div>
    <div style="font-size:10px;color:var(--text3);margin-bottom:8px">Verde = in target · Rosso = fuori target · 🏋️ = giorno sport</div>
    ${histHtml}
  </div>
  <div class="card"><div class="card-title">Quick meals</div>${mrows}<button class="new-meal-btn" onclick="newMeal()">+ Nuova meal</button></div>
  <div class="card"><div class="card-title">Promemoria serale</div>
    <div class="set-row"><span class="set-lbl" style="color:var(--text2)">Notifica alle 19:00 — "Tieni duro!"</span><button class="toggle ${S.notifEnabled?'on':''}" onclick="togNotif()"></button></div>
  </div>`;
}

function toggleDbUnit(){const t=document.getElementById('db-type').value;document.getElementById('db-unit-row').style.display=t==='unit'?'block':'none'}
function addFoodToDB(){
  const name=document.getElementById('db-name').value.trim();if(!name){alert('Inserisci un nome');return}
  const cat=document.getElementById('db-cat').value;
  const isUnit=document.getElementById('db-type').value==='unit';
  const unitName=isUnit?(document.getElementById('db-unit-name').value.trim()||'unità'):'g';
  const newFood={id:'cu'+Date.now(),name,cat,unit:unitName,
    kcal:parseFloat(document.getElementById('db-kcal').value)||0,
    protein:parseFloat(document.getElementById('db-prot').value)||0,
    carbs:parseFloat(document.getElementById('db-carb').value)||0,
    fat:parseFloat(document.getElementById('db-fat').value)||0,
    fiber:parseFloat(document.getElementById('db-fib').value)||0};
  if(isUnit)newFood.perUnit=1;
  S.foods.push(newFood);save();alert(`"${name}" aggiunto!`);renderSettings();
}
function updGoal(k,v){S.goals[k]=parseFloat(v)||0;save();updateHeader()}
function togMeal(i){S.editMeal=S.editMeal===i?null:i;renderSettings()}
function updMN(i,v){S.meals[i].name=v;save()}
function updMI(mi,ii,k,v){S.meals[mi].items[ii][k]=k==='qty'?parseFloat(v)||0:v;save()}
function remMI(mi,ii){S.meals[mi].items.splice(ii,1);save();renderSettings()}
function addMI(mi){S.meals[mi].items.push({fid:S.foods[0].id,qty:100});save();renderSettings()}
function delMeal(i){if(!confirm('Eliminare?'))return;S.meals.splice(i,1);S.editMeal=null;save();renderSettings()}
function newMeal(){S.meals.push({id:'m'+Date.now(),name:'Nuova meal',items:[]});S.editMeal=S.meals.length-1;save();renderSettings()}
function togNotif(){
  if(!S.notifEnabled){if(!('Notification' in window)){alert('Salva come PWA');return}Notification.requestPermission().then(p=>{if(p==='granted'){S.notifEnabled=true;save();schedNotif();renderSettings()}else alert('Permesso negato')});}
  else{S.notifEnabled=false;save();renderSettings()}
}
let nTimer=null;
function schedNotif(){if(nTimer)clearTimeout(nTimer);if(!S.notifEnabled)return;const now=new Date(),f=new Date();f.setHours(19,0,0,0);if(f<=now)f.setDate(f.getDate()+1);nTimer=setTimeout(()=>{if(S.notifEnabled&&Notification.permission==='granted')new Notification('🤖 Rob-Ot',{body:'Tieni duro! Sei a un passo dal completare la giornata.'});schedNotif()},f-now)}

function openModal(fid){
  const f=S.foods.find(x=>x.id===fid);if(!f)return;
  S.pendingFood=f;
  document.getElementById('qtyTitle').textContent=f.name;
  document.getElementById('qtySub').textContent=f.perUnit?`Numero di ${f.unit}`:`Quantità in ${f.unit} (valori per 100${f.unit}: ${f.kcal} kcal)`;
  document.getElementById('qtyInput').value='';
  document.getElementById('qtyModal').style.display='flex';
  setTimeout(()=>document.getElementById('qtyInput').focus(),100);
}
function closeModal(){document.getElementById('qtyModal').style.display='none';S.pendingFood=null}
function confirmAdd(){
  const f=S.pendingFood;if(!f)return;
  const qty=parseFloat(document.getElementById('qtyInput').value)||0;if(qty<=0)return;
  const m=calc(f,qty);
  getLog().push({name:`${f.name} (${qty}${f.perUnit?' '+f.unit:f.unit})`,kcal:m.kcal,protein:m.protein,carbs:m.carbs,fat:m.fat,fiber:m.fiber});
  save();updateHeader();closeModal();if(activeTab==='today')renderToday();
}
function addMeal(mid){
  const m=S.meals.find(x=>x.id===mid);if(!m)return;
  m.items.forEach(it=>{const f=S.foods.find(x=>x.id===it.fid);if(!f)return;const c=calc(f,it.qty);getLog().push({name:`${f.name} (${it.qty}${f.perUnit?' '+f.unit:f.unit}) [${m.name}]`,kcal:c.kcal,protein:c.protein,carbs:c.carbs,fat:c.fat,fiber:c.fiber})});
  save();updateHeader();switchTab('today');
}

renderDate();updateHeader();renderTab('today');
if(S.notifEnabled)schedNotif();
</script>
</body>
</html>
