<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rob-Ot">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="android-chrome-192x192.png">
<title>Rob-Ot</title>
<style>
:root{
  --bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--bg4:#252525;
  --border:#2a2a2a;--border2:#333;
  --text:#f0f0f0;--text2:#888;--text3:#555;
  --green:#00e676;--green2:#00c853;--green-dim:rgba(0,230,118,.12);
  --orange:#ff6d00;--blue:#448aff;--yellow:#ffd740;--red:#ff5252;--purple:#e040fb;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh;overscroll-behavior:none}
.app{max-width:430px;margin:0 auto;padding:0 0 90px}
.header{background:rgba(13,13,13,.95);border-bottom:1px solid var(--border);padding:10px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(20px)}
.logo{display:flex;align-items:center;gap:10px}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-name{font-size:16px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:8px}
.streak-pill{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 9px}
.streak-pill-icon{font-size:13px;line-height:1}
.streak-pill-num{font-size:13px;font-weight:700;color:var(--orange)}
.streak-pill-lbl{font-size:10px;color:var(--text3)}
.date-nav{display:flex;align-items:center;gap:4px}
.date-nav button{background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:15px;width:26px;height:26px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.date-label{font-size:11px;color:var(--text2);min-width:52px;text-align:center}
.tabs{display:flex;background:rgba(13,13,13,.95);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:99;padding:0 8px;backdrop-filter:blur(20px)}
.tab{flex:1;padding:10px 2px;text-align:center;font-size:10px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:var(--text3);transition:all .15s;letter-spacing:.4px;text-transform:uppercase}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.section{padding:14px 16px}
.macro-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.mc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;position:relative;overflow:hidden}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.mc.kcal::before{background:var(--orange)}.mc.prot::before{background:var(--green)}
.mc.carb::before{background:var(--blue)}.mc.fat::before{background:var(--yellow)}.mc.fib::before{background:var(--purple)}
.mc.full{grid-column:1/-1}
.mc-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.mc-val{font-size:21px;font-weight:700;line-height:1;color:var(--text)}
.mc-unit{font-size:12px;font-weight:400;color:var(--text3)}
.mc-sub{font-size:11px;color:var(--text3);margin-top:2px}
.mc-rem{position:absolute;top:11px;right:10px;font-size:10px;color:var(--text3);text-align:right;line-height:1.4}
.mc-rem .val{display:block;font-size:12px;font-weight:700;color:var(--text2)}
.mc-rem .val.done{color:var(--green)}
.bar{height:3px;background:var(--bg4);border-radius:2px;margin-top:8px;overflow:hidden}
.bar-f{height:100%;border-radius:2px;transition:width .4s}
.b-kcal{background:var(--orange)}.b-prot{background:var(--green)}.b-carb{background:var(--blue)}.b-fat{background:var(--yellow)}.b-fib{background:var(--purple)}
.sport-btn{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 14px;margin-bottom:12px;cursor:pointer;transition:all .15s}
.sport-btn.active{border-color:var(--blue);background:rgba(68,138,255,.08)}
.sport-btn-icon{font-size:18px}
.sport-btn-text{flex:1}
.sport-btn-label{font-size:13px;font-weight:500}
.sport-btn-sub{font-size:11px;color:var(--text3);margin-top:1px}
.sport-badge{background:var(--blue);color:#fff;border-radius:4px;font-size:10px;font-weight:700;padding:2px 6px}
.log-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0;margin-bottom:4px}
.log-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.log-toggle-icon{font-size:10px;color:var(--text3);transition:transform .2s}
.log-toggle-icon.open{transform:rotate(180deg)}
.log-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.log-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.log-info{flex:1;min-width:0}
.log-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-mac{font-size:11px;color:var(--text3);margin-top:2px}
.log-kcal{font-size:14px;font-weight:700;color:var(--orange);flex-shrink:0}
.del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;line-height:1;padding:2px 4px;border-radius:4px}
.del-btn:active{color:var(--red)}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:28px 0;line-height:2}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card-title{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;font-weight:600}
.meal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.meal-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:10px;cursor:pointer;text-align:left}
.meal-btn:active{background:var(--bg4)}
.meal-btn-name{font-size:13px;font-weight:500;color:var(--text)}
.meal-btn-kcal{font-size:11px;color:var(--orange);margin-top:3px}
.cat-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0;border-bottom:1px solid var(--border)}
.cat-name{font-size:12px;font-weight:600;color:var(--text2)}
.cat-n{font-size:11px;color:var(--text3);margin-left:4px}
.cat-arr{font-size:10px;color:var(--text3)}
.food-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.food-row:last-child{border-bottom:none}
.food-row-name{font-size:13px;font-weight:500}
.food-row-sub{font-size:11px;color:var(--text3);margin-top:1px}
.add-btn{background:var(--green-dim);border:1px solid var(--green);border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--green);font-weight:600}
.add-btn:active{background:var(--green);color:#000}
.man-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.man-field{display:flex;flex-direction:column;gap:4px}
.man-field label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.man-field input,.man-field select{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:9px 10px;font-size:14px;color:var(--text);outline:none}
.man-field input:focus,.man-field select:focus{border-color:var(--green)}
.man-field.full{grid-column:1/-1}
.man-add{width:100%;margin-top:10px;background:var(--green);color:#000;border:none;border-radius:var(--rs);padding:11px;font-size:14px;font-weight:700;cursor:pointer}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-lbl{font-size:13px;color:var(--text)}
.set-inp{width:78px;text-align:right;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:5px 8px;font-size:13px;color:var(--text)}
.toggle{width:44px;height:26px;background:var(--bg4);border-radius:13px;position:relative;cursor:pointer;border:1px solid var(--border2);transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--green);border-color:var(--green)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.toggle.on::after{left:20px}
.sm-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:4px 9px;font-size:11px;cursor:pointer;color:var(--text2)}
.sm-btn.del{border-color:rgba(255,82,82,.35);color:var(--red)}
.meal-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:10px;margin-bottom:6px}
.meal-card-hdr{display:flex;align-items:center;justify-content:space-between}
.meal-ed-item{display:flex;align-items:center;gap:5px;margin-bottom:5px;margin-top:8px}
.meal-ed-item select,.meal-ed-item input[type=number]{background:var(--bg4);border:1px solid var(--border2);border-radius:5px;padding:5px 7px;font-size:12px;color:var(--text)}
.meal-ed-item select{flex:1}.meal-ed-item input[type=number]{width:58px}
.meal-ed-item button{background:none;border:none;color:var(--red);font-size:17px;cursor:pointer}
.ing-btn{background:none;border:1px solid var(--border2);border-radius:5px;padding:4px 8px;font-size:11px;color:var(--text3);cursor:pointer;margin-top:4px}
.new-meal-btn{width:100%;background:var(--green-dim);border:1px solid var(--green);color:var(--green);border-radius:var(--rs);padding:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px}
.hist-table{width:100%;border-collapse:collapse;font-size:12px}
.hist-table th{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--border);text-align:right}
.hist-table th:first-child{text-align:left}
.hist-table td{padding:7px 4px;border-bottom:1px solid var(--border);color:var(--text2);text-align:right;font-variant-numeric:tabular-nums}
.hist-table td:first-child{text-align:left;color:var(--text);font-weight:500}
.hist-table tr:last-child td{border-bottom:none}
.hist-ok{color:var(--green);font-weight:600}
.hist-over{color:var(--red);font-weight:600}
.unit-tag{font-size:10px;color:var(--orange);font-weight:600;margin-left:4px;opacity:.8}
.qty-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;z-index:200;backdrop-filter:blur(6px)}
.qty-inner{background:var(--bg2);border:1px solid var(--border2);border-radius:18px 18px 0 0;padding:22px 16px 38px;width:100%;max-width:430px;margin:0 auto}
.qty-title{font-size:17px;font-weight:700;margin-bottom:3px}
.qty-sub{font-size:12px;color:var(--text3);margin-bottom:16px}
.qty-row{display:flex;gap:8px}
.qty-row input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:13px;font-size:19px;color:var(--text);outline:none}
.qty-row input:focus{border-color:var(--green)}
.qty-row button{background:var(--green);color:#000;border:none;border-radius:var(--rs);padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer}
.qty-cancel{background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;margin-top:12px;width:100%;text-align:center;padding:6px}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <div class="logo">
    <div style="width:36px;height:36px;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px">🤖</div>
    <div class="logo-text">
      <span class="logo-name">Rob-Ot</span>
      <span class="logo-sub">Meal Tracker by Rob</span>
    </div>
  </div>
  <div class="header-right">
    <div class="streak-pill">
      <span class="streak-pill-icon" id="streakIcon">💪</span>
      <span class="streak-pill-num" id="streakNum">0</span>
      <span class="streak-pill-lbl">days</span>
    </div>
    <div class="date-nav">
      <button onclick="changeDay(-1)">‹</button>
      <span class="date-label" id="dateLabel"></span>
      <button onclick="changeDay(1)">›</button>
    </div>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('today')">Today</div>
  <div class="tab" onclick="switchTab('add')">Add</div>
  <div class="tab" onclick="switchTab('settings')">Settings</div>
</div>
<div id="tab-today" class="section"></div>
<div id="tab-add" class="section" style="display:none"></div>
<div id="tab-settings" class="section" style="display:none"></div>
</div>

<div class="qty-modal" id="qtyModal" style="display:none">
  <div class="qty-inner">
    <div class="qty-title" id="qtyTitle"></div>
    <div class="qty-sub" id="qtySub"></div>
    <div class="qty-row">
      <input type="number" id="qtyInput" min="1" max="5000" placeholder="0">
      <button onclick="confirmAdd()">Add</button>
    </div>
    <button class="qty-cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

  {id:'f52',name:'Oat milk',cat:'other',unit:'ml',kcal:62,protein:1.2,carbs:6.7,fat:3.2,fiber:0.6},
  {id:'f53',name:'Almond butter',cat:'other',unit:'g',kcal:627,protein:19.4,carbs:11.6,fat:54,fiber:11},
];
const DMEALS=[
  {id:'m1',name:'My Breakfast',items:[{fid:'f13',qty:150},{fid:'f22',qty:2},{fid:'f45',qty:150}]},
  {id:'m2',name:'Post-Workout',items:[{fid:'f42',qty:30},{fid:'f39',qty:1}]},
  {id:'m3',name:'Chicken & Rice',items:[{fid:'f13',qty:200},{fid:'f3',qty:150},{fid:'f34',qty:100}]},
];

let S={
  goals:{...DGOALS},
  foods:JSON.parse(JSON.stringify(DFOODS)),
  meals:JSON.parse(JSON.stringify(DMEALS)),
  logs:{},sportDays:{},
  notifEnabled:false,currentDate:today(),
  pendingFood:null,
  catOpen:{carbs:false,protein:false,veggies:false,other:false},
  editMeal:null,logOpen:false,
};

function today(){return new Date().toISOString().slice(0,10)}
function load(){try{const p=JSON.parse(localStorage.getItem('robot3')||'{}');['goals','foods','meals','logs','notifEnabled','sportDays'].forEach(k=>{if(p[k]!==undefined)S[k]=p[k]})}catch(e){}}
function save(){try{localStorage.setItem('robot3',JSON.stringify({goals:S.goals,foods:S.foods,meals:S.meals,logs:S.logs,notifEnabled:S.notifEnabled,sportDays:S.sportDays||{}}))}catch(e){}}
load();

function getLog(dk){dk=dk||S.currentDate;if(!S.logs[dk])S.logs[dk]=[];return S.logs[dk]}
function calc(f,qty){const m=qty/(f.perUnit?1:100);return{kcal:Math.round(f.kcal*m),protein:r1(f.protein*m),carbs:r1(f.carbs*m),fat:r1(f.fat*m),fiber:r1(f.fiber*m)}}
function r1(n){return Math.round(n*10)/10}
function totals(dk){const l=S.logs[dk]||[];const t={kcal:0,protein:0,carbs:0,fat:0,fiber:0};l.forEach(e=>{t.kcal+=e.kcal;t.protein+=e.protein;t.carbs+=e.carbs;t.fat+=e.fat;t.fiber+=e.fiber});return{kcal:Math.round(t.kcal),protein:r1(t.protein),carbs:r1(t.carbs),fat:r1(t.fat),fiber:r1(t.fiber)}}
function pct(v,g){return Math.min(100,Math.round(v/g*100))}

function getDayTarget(dk){return S.goals.kcal+((S.sportDays||{})[dk]?200:0)}
function isDayValid(dk){const t=totals(dk);if((S.logs[dk]||[]).length===0)return null;return t.kcal<=getDayTarget(dk)+201}
function isDayOver(dk){const t=totals(dk);if((S.logs[dk]||[]).length===0)return false;return t.kcal>getDayTarget(dk)+201}
function isDoubleover(dk){const t=totals(dk);if((S.logs[dk]||[]).length===0)return false;return t.kcal>=S.goals.kcal*2}
function getWeekMon(dk){const d=new Date(dk+'T12:00:00');const day=d.getDay();const diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);return d.toISOString().slice(0,10)}

function calcStreak(){
  let streak=0;
  const d=new Date(today()+'T12:00:00');
  const weekOverCount={};
  for(let i=0;i<365;i++){
    const dk=d.toISOString().slice(0,10);
    const valid=isDayValid(dk);
    const over=isDayOver(dk);
    const dbl=isDoubleover(dk);
    const mon=getWeekMon(dk);
    if(!weekOverCount[mon])weekOverCount[mon]=0;
    if(over)weekOverCount[mon]++;
    if(dbl)break;
    if(weekOverCount[mon]>=2)break;
    if(valid===null&&i>0)break;
    if(valid)streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function updateHeader(){
  const streak=calcStreak();
  document.getElementById('streakNum').textContent=streak;
  document.getElementById('streakIcon').textContent=streak>=7?'🔥':streak>=3?'⚡':'💪';
}

function renderDate(){const d=new Date(S.currentDate+'T12:00:00');document.getElementById('dateLabel').textContent=S.currentDate===today()?'Today':d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function changeDay(dir){const d=new Date(S.currentDate+'T12:00:00');d.setDate(d.getDate()+dir);const n=d.toISOString().slice(0,10);if(n>today())return;S.currentDate=n;renderDate();renderTab('today')}

let activeTab='today';
function switchTab(t){activeTab=t;document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['today','add','settings'][i]===t));['today','add','settings'].forEach(id=>{document.getElementById('tab-'+id).style.display=id===t?'block':'none'});renderTab(t)}
function renderTab(t){t==='today'?renderToday():t==='add'?renderAdd():renderSettings()}

function toggleSport(){
  if(!S.sportDays)S.sportDays={};
  S.sportDays[S.currentDate]=!S.sportDays[S.currentDate];
  save();updateHeader();renderToday();
}
function toggleLog(){S.logOpen=!S.logOpen;const items=document.getElementById('logItems');const icon=document.getElementById('logIcon');if(items){items.style.display=S.logOpen?'block':'none';icon.classList.toggle('open',S.logOpen)}}

function renderToday(){
  const t=totals(S.currentDate),g=S.goals,l=getLog();
  const isSport=!!(S.sportDays||{})[S.currentDate];
  const dayTarget=getDayTarget(S.currentDate);
  function rem(v,goal,u){const rv=r1(goal-v);return rv>0?`<span class="val">${rv}${u}</span>left`:`<span class="val done">✓</span>`}
  let logHtml='';
  if(!l.length)logHtml=`<div class="empty">🤖 Nothing yet — go to Add</div>`;
  else l.forEach((e,i)=>{logHtml+=`<div class="log-item"><div class="log-dot"></div><div class="log-info"><div class="log-name">${e.name}</div><div class="log-mac">P ${e.protein}g · C ${e.carbs}g · F ${e.fat}g · Fb ${e.fiber}g</div></div><div class="log-kcal">${e.kcal}</div><button class="del-btn" onclick="delLog(${i})">×</button></div>`});
  document.getElementById('tab-today').innerHTML=`
  <div class="sport-btn ${isSport?'active':''}" onclick="toggleSport()">
    <div class="sport-btn-icon">🏋️</div>
    <div class="sport-btn-text">
      <div class="sport-btn-label">Sport day</div>
      <div class="sport-btn-sub">${isSport?'Active — target +200 kcal ('+dayTarget+' kcal)':'Tap to activate — adds +200 kcal to target'}</div>
    </div>
    ${isSport?'<span class="sport-badge">ON</span>':''}
  </div>
  <div class="macro-grid">
    <div class="mc full kcal">
      <div class="mc-label">Calories</div>
      <div class="mc-val">${t.kcal}<span class="mc-unit"> / ${dayTarget} kcal</span></div>
      <div class="mc-rem">${rem(t.kcal,dayTarget,'')}</div>
      <div class="bar"><div class="bar-f b-kcal" style="width:${pct(t.kcal,dayTarget)}%"></div></div>
    </div>
    <div class="mc prot">
      <div class="mc-label">Protein</div>
      <div class="mc-val">${t.protein}<span class="mc-unit">g</span></div>
      <div class="mc-sub">/ ${g.protein}g</div>
      <div class="mc-rem">${rem(t.protein,g.protein,'g')}</div>
      <div class="bar"><div class="bar-f b-prot" style="width:${pct(t.protein,g.protein)}%"></div></div>
    </div>
    <div class="mc carb">
      <div class="mc-label">Carbs</div>
      <div class="mc-val">${t.carbs}<span class="mc-unit">g</span></div>
      <div class="mc-sub">/ ${g.carbs}g</div>
      <div class="mc-rem">${rem(t.carbs,g.carbs,'g')}</div>
      <div class="bar"><div class="bar-f b-carb" style="width:${pct(t.carbs,g.carbs)}%"></div></div>
    </div>
    <div class="mc fat">
      <div class="mc-label">Fat</div>
      <div class="mc-val">${t.fat}<span class="mc-unit">g</span></div>
      <div class="mc-sub">/ ${g.fat}g</div>
      <div class="mc-rem">${rem(t.fat,g.fat,'g')}</div>
      <div class="bar"><div class="bar-f b-fat" style="width:${pct(t.fat,g.fat)}%"></div></div>
    </div>
    <div class="mc fib">
      <div class="mc-label">Fiber</div>
      <div class="mc-val">${t.fiber}<span class="mc-unit">g</span></div>
      <div class="mc-sub">/ ${g.fiber}g</div>
      <div class="mc-rem">${rem(t.fiber,g.fiber,'g')}</div>
      <div class="bar"><div class="bar-f b-fib" style="width:${pct(t.fiber,g.fiber)}%"></div></div>
    </div>
  </div>
  <div class="log-toggle" onclick="toggleLog()">
    <span class="log-lbl">Daily log (${l.length})</span>
    <span class="log-toggle-icon ${S.logOpen?'open':''}" id="logIcon">▼</span>
  </div>
  <div id="logItems" style="display:${S.logOpen?'block':'none'}">${logHtml}</div>`;
}

function delLog(i){getLog().splice(i,1);save();updateHeader();renderToday()}

function renderAdd(){
  const meals=S.meals.map(m=>{const tot=m.items.reduce((a,it)=>{const f=S.foods.find(x=>x.id===it.fid);return f?{kcal:a.kcal+calc(f,it.qty).kcal}:a},{kcal:0});return`<button class="meal-btn" onclick="addMeal('${m.id}')"><div class="meal-btn-name">${m.name}</div><div class="meal-btn-kcal">~${Math.round(tot.kcal)} kcal</div></button>`}).join('');
  const cats=[{key:'carbs',label:'Carbs'},{key:'protein',label:'Protein'},{key:'veggies',label:'Veggies & Fruit'},{key:'other',label:'Other'}];
  const db=cats.map(c=>{
    const foods=S.foods.filter(f=>f.cat===c.key);const open=S.catOpen[c.key];
    const rows=foods.map(f=>{const isUnit=!!f.perUnit;return`<div class="food-row"><div><div class="food-row-name">${f.name}${isUnit?'<span class="unit-tag">(u)</span>':''}</div><div class="food-row-sub">${f.kcal} kcal · ${isUnit?'per unit':'per 100'+f.unit}</div></div><button class="add-btn" onclick="openModal('${f.id}')">+ Add</button></div>`}).join('');
    return`<div><div class="cat-hdr" onclick="toggleCat('${c.key}')"><span><span class="cat-name">${c.label}</span><span class="cat-n">(${foods.length})</span></span><span class="cat-arr">${open?'▲':'▼'}</span></div><div style="display:${open?'block':'none'}">${rows}</div></div>`;
  }).join('');
  document.getElementById('tab-add').innerHTML=`
  <div class="card"><div class="card-title">Quick meals</div><div class="meal-grid">${meals}</div></div>
  <div class="card"><div class="card-title">Food database</div>${db}</div>
  <div class="card">
    <div class="card-title">Add manually</div>
    <div class="man-grid">
      <div class="man-field full"><label>Name</label><input type="text" id="mn" placeholder="e.g. Lunch out"></div>
      <div class="man-field"><label>Calories (kcal)</label><input type="number" id="mk" placeholder="0" min="0"></div>
      <div class="man-field"><label>Protein (g)</label><input type="number" id="mp" placeholder="0" min="0" step="0.1"></div>
      <div class="man-field"><label>Carbs (g)</label><input type="number" id="mc2" placeholder="0" min="0" step="0.1"></div>
      <div class="man-field"><label>Fat (g)</label><input type="number" id="mf" placeholder="0" min="0" step="0.1"></div>
      <div class="man-field"><label>Fiber (g)</label><input type="number" id="mfi" placeholder="0" min="0" step="0.1"></div>
    </div>
    <button class="man-add" onclick="addManual()">+ Add to log</button>
  </div>`;
}

function addManual(){
  const name=document.getElementById('mn').value.trim()||'Manual entry';
  const kcal=Math.round(parseFloat(document.getElementById('mk').value)||0);
  const protein=r1(parseFloat(document.getElementById('mp').value)||0);
  const carbs=r1(parseFloat(document.getElementById('mc2').value)||0);
  const fat=r1(parseFloat(document.getElementById('mf').value)||0);
  const fiber=r1(parseFloat(document.getElementById('mfi').value)||0);
  getLog().push({name,kcal,protein,carbs,fat,fiber});save();updateHeader();switchTab('today');
}
function toggleCat(k){S.catOpen[k]=!S.catOpen[k];renderAdd()}

function renderSettings(){
  const g=S.goals;
  const allDays=Object.keys(S.logs).filter(k=>(S.logs[k]||[]).length>0).sort().reverse().slice(0,30);
  let histHtml='';
  if(!allDays.length)histHtml=`<div style="text-align:center;color:var(--text3);font-size:12px;padding:16px 0">No data yet</div>`;
  else{
    histHtml=`<table class="hist-table"><thead><tr><th>Date</th><th>Kcal</th><th>Prot</th><th>Carb</th><th>Fat</th><th>Fb</th></tr></thead><tbody>`;
    allDays.forEach(k=>{
      const t=totals(k);const d=new Date(k+'T12:00:00');
      const lbl=k===today()?'Today':d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
      const target=getDayTarget(k);const ok=t.kcal<=target+201;
      const sport=!!(S.sportDays||{})[k];
      histHtml+=`<tr><td>${lbl}${sport?' 🏋️':''}</td><td class="${ok?'hist-ok':'hist-over'}">${t.kcal}</td><td>${t.protein}</td><td>${t.carbs}</td><td>${t.fat}</td><td>${t.fiber}</td></tr>`;
    });
    histHtml+=`</tbody></table>`;
  }
  const mrows=S.meals.map((m,mi)=>{
    const ed=S.editMeal===mi;
    let items='';
    if(ed)items=m.items.map((it,ii)=>`<div class="meal-ed-item"><select onchange="updMI(${mi},${ii},'fid',this.value)">${S.foods.map(f=>`<option value="${f.id}"${f.id===it.fid?' selected':''}>${f.name}${f.perUnit?' (u)':''}</option>`).join('')}</select><input type="number" value="${it.qty}" min="1" onchange="updMI(${mi},${ii},'qty',this.value)"><button onclick="remMI(${mi},${ii})">×</button></div>`).join('');
    return`<div class="meal-card"><div class="meal-card-hdr">${ed?`<input style="background:var(--bg4);border:1px solid var(--border2);border-radius:5px;padding:4px 8px;font-size:13px;color:var(--text);width:130px" value="${m.name}" onchange="updMN(${mi},this.value)">`:`<span style="font-size:13px;font-weight:500">${m.name}</span>`}<div style="display:flex;gap:4px"><button class="sm-btn" onclick="togMeal(${mi})">${ed?'Save':'Edit'}</button><button class="sm-btn del" onclick="delMeal(${mi})">Delete</button></div></div>${ed?`<div>${items}<button class="ing-btn" onclick="addMI(${mi})">+ Ingredient</button></div>`:''}</div>`;
  }).join('');

  document.getElementById('tab-settings').innerHTML=`
  <div class="card"><div class="card-title">Daily goals</div>
    ${['kcal','protein','carbs','fat','fiber'].map(k=>`<div class="set-row"><span class="set-lbl">${{kcal:'Calories',protein:'Protein',carbs:'Carbs',fat:'Fat',fiber:'Fiber'}[k]} ${k==='kcal'?'(kcal)':'(g)'}</span><input class="set-inp" type="number" value="${g[k]}" onchange="updGoal('${k}',this.value)"></div>`).join('')}
  </div>
  <div class="card">
    <div class="card-title">Add food to database</div>
    <div class="man-grid">
      <div class="man-field full"><label>Name</label><input type="text" id="db-name" placeholder="e.g. Quinoa"></div>
      <div class="man-field full"><label>Category</label><select id="db-cat"><option value="carbs">Carbs</option><option value="protein">Protein</option><option value="veggies">Veggies & Fruit</option><option value="other">Other</option></select></div>
      <div class="man-field full"><label>Measurement type</label><select id="db-type" onchange="toggleDbUnit()"><option value="100g">Per 100g / ml</option><option value="unit">Per unit</option></select></div>
      <div class="man-field full" id="db-unit-row" style="display:none"><label>Unit name (e.g. egg, slice)</label><input type="text" id="db-unit-name" placeholder="e.g. slice"></div>
      <div class="man-field"><label>Calories (kcal)</label><input type="number" id="db-kcal" placeholder="0" min="0"></div>
      <div class="man-field"><label>Protein (g)</label><input type="number" id="db-prot" placeholder="0" min="0" step="0.1"></div>
      <div class="man-field"><label>Carbs (g)</label><input type="number" id="db-carb" placeholder="0" min="0" step="0.1"></div>
      <div class="man-field"><label>Fat (g)</label><input type="number" id="db-fat" placeholder="0" min="0" step="0.1"></div>
      <div class="man-field"><label>Fiber (g)</label><input type="number" id="db-fib" placeholder="0" min="0" step="0.1"></div>
    </div>
    <button class="man-add" onclick="addFoodToDB()">+ Add to database</button>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div class="card-title" style="margin-bottom:0">History (last 30 days)</div>
      <button onclick="resetApp()" style="background:none;border:1px solid rgba(255,82,82,.4);border-radius:5px;padding:3px 8px;font-size:10px;color:var(--red);cursor:pointer">Reset</button>
    </div>
    <div style="font-size:10px;color:var(--text3);margin-bottom:8px">Green = on target · Red = over target · 🏋️ = sport day</div>
    ${histHtml}
  </div>
  <div class="card"><div class="card-title">Quick meals</div>${mrows}<button class="new-meal-btn" onclick="newMeal()">+ New meal</button></div>
  <div class="card"><div class="card-title">Evening reminder</div>
    <div class="set-row"><span class="set-lbl" style="color:var(--text2)">Notification at 7:00 PM — "Stay strong!"</span><button class="toggle ${S.notifEnabled?'on':''}" onclick="togNotif()"></button></div>
  </div>`;
}

function resetApp(){
  if(!confirm('Are you sure you want to reset all data?\nThis action cannot be undone.'))return;
  const code=prompt('Enter 9456 to confirm reset:');
  if(code!=='9456'){alert('Wrong code. Reset cancelled.');return;}
  S.logs={};S.sportDays={};
  save();updateHeader();renderSettings();alert('✅ Data reset successfully.');
}
function toggleDbUnit(){const t=document.getElementById('db-type').value;document.getElementById('db-unit-row').style.display=t==='unit'?'block':'none'}
function addFoodToDB(){
  const name=document.getElementById('db-name').value.trim();if(!name){alert('Please enter a name');return}
  const cat=document.getElementById('db-cat').value;
  const isUnit=document.getElementById('db-type').value==='unit';
  const unitName=isUnit?(document.getElementById('db-unit-name').value.trim()||'unit'):'g';
  const newFood={id:'cu'+Date.now(),name,cat,unit:unitName,
    kcal:parseFloat(document.getElementById('db-kcal').value)||0,
    protein:parseFloat(document.getElementById('db-prot').value)||0,
    carbs:parseFloat(document.getElementById('db-carb').value)||0,
    fat:parseFloat(document.getElementById('db-fat').value)||0,
    fiber:parseFloat(document.getElementById('db-fib').value)||0};
  if(isUnit)newFood.perUnit=1;
  S.foods.push(newFood);save();alert(`"${name}" added!`);renderSettings();
}
function updGoal(k,v){S.goals[k]=parseFloat(v)||0;save();updateHeader()}
function togMeal(i){S.editMeal=S.editMeal===i?null:i;renderSettings()}
function updMN(i,v){S.meals[i].name=v;save()}
function updMI(mi,ii,k,v){S.meals[mi].items[ii][k]=k==='qty'?parseFloat(v)||0:v;save()}
function remMI(mi,ii){S.meals[mi].items.splice(ii,1);save();renderSettings()}
function addMI(mi){S.meals[mi].items.push({fid:S.foods[0].id,qty:100});save();renderSettings()}
function delMeal(i){if(!confirm('Delete this meal?'))return;S.meals.splice(i,1);S.editMeal=null;save();renderSettings()}
function newMeal(){S.meals.push({id:'m'+Date.now(),name:'New meal',items:[]});S.editMeal=S.meals.length-1;save();renderSettings()}
function togNotif(){
  if(!S.notifEnabled){if(!('Notification' in window)){alert('Save as PWA to enable notifications');return}Notification.requestPermission().then(p=>{if(p==='granted'){S.notifEnabled=true;save();schedNotif();renderSettings()}else alert('Permission denied')});}
  else{S.notifEnabled=false;save();renderSettings()}
}
let nTimer=null;
function schedNotif(){if(nTimer)clearTimeout(nTimer);if(!S.notifEnabled)return;const now=new Date(),f=new Date();f.setHours(19,0,0,0);if(f<=now)f.setDate(f.getDate()+1);nTimer=setTimeout(()=>{if(S.notifEnabled&&Notification.permission==='granted')new Notification('🤖 Rob-Ot',{body:'Stay strong! You\'re close to completing the day.'});schedNotif()},f-now)}
function openModal(fid){const f=S.foods.find(x=>x.id===fid);if(!f)return;S.pendingFood=f;document.getElementById('qtyTitle').textContent=f.name;document.getElementById('qtySub').textContent=f.perUnit?`Number of ${f.unit}s`:`Amount in ${f.unit} (per 100${f.unit}: ${f.kcal} kcal)`;document.getElementById('qtyInput').value='';document.getElementById('qtyModal').style.display='flex';setTimeout(()=>document.getElementById('qtyInput').focus(),100)}
function closeModal(){document.getElementById('qtyModal').style.display='none';S.pendingFood=null}
function confirmAdd(){const f=S.pendingFood;if(!f)return;const qty=parseFloat(document.getElementById('qtyInput').value)||0;if(qty<=0)return;const m=calc(f,qty);getLog().push({name:`${f.name} (${qty}${f.perUnit?' '+f.unit:f.unit})`,kcal:m.kcal,protein:m.protein,carbs:m.carbs,fat:m.fat,fiber:m.fiber});save();updateHeader();closeModal();if(activeTab==='today')renderToday()}
function addMeal(mid){const m=S.meals.find(x=>x.id===mid);if(!m)return;m.items.forEach(it=>{const f=S.foods.find(x=>x.id===it.fid);if(!f)return;const c=calc(f,it.qty);getLog().push({name:`${f.name} (${it.qty}${f.perUnit?' '+f.unit:f.unit}) [${m.name}]`,kcal:c.kcal,protein:c.protein,carbs:c.carbs,fat:c.fat,fiber:c.fiber})});save();updateHeader();switchTab('today')}

renderDate();updateHeader();renderTab('today');
if(S.notifEnabled)schedNotif();
</script>
</body>
</html>
